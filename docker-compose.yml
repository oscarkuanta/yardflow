services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yardflow
      MYSQL_USER: yardflow
      MYSQL_PASSWORD: yardflow
      TZ: UTC
    ports:
      - '${DB_PORT:-3307}:3306'
    volumes:
      - yardflow-db:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uyardflow', '-pyardflow']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  yardflow-db:
