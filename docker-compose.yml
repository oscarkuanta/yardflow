services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yardflow
      MYSQL_USER: yardflow
      MYSQL_PASSWORD: yardflow
      TZ: UTC
    ports:
      - '${DB_PORT:-3307}:3306'
    volumes:
      - yardflow-db:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uyardflow', '-pyardflow']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://yardflow:yardflow@db:3306/yardflow
      SESSION_SECRET: ${SESSION_SECRET:-local-docker-demo-secret-change-me}
      WEB_ORIGIN: http://localhost:8080
      NODE_ENV: production
      HTTPS_ONLY: 'false'
      SEED_ON_START: if-empty
      TZ: Europe/Berlin

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  yardflow-db:
