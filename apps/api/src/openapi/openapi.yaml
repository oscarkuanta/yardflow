openapi: 3.1.0
info:
  title: YardFlow API
  version: 0.1.0
  description: |
    REST API of YardFlow, a container yard management system for one container terminal.

    Log in with `POST /auth/login` first. The API answers with an httpOnly session cookie
    that Swagger UI sends automatically with every following request.

    Demo logins (password `demo1234`): `admin@yardflow.dev`, `planner@yardflow.dev`,
    `gate@yardflow.dev`, `ops@hansenorth.example`, `ops@nordtrans.example`.
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Log in, log out and read the current user
  - name: System
    description: Health and liveness
  - name: Users
    description: Staff and customer accounts (Admin)
  - name: Companies
    description: Customer companies (Admin)
  - name: Blocks
    description: Yard blocks with geometry and occupancy
  - name: Tariffs
    description: Storage tariffs per size and dangerous goods flag (Admin)
  - name: Time slots
    description: Hourly gate slots with capacity
  - name: Containers
    description: Search containers and read their detail. Customers see only their own company.
  - name: Yard
    description: Live yard map, stack side view, slot suggestion and moves
  - name: Work orders
    description: Relocation work orders that clear containers above a pickup or load
  - name: Vessel visits
    description: Vessel calls with discharge and load lists (Admin and Planner)

paths:
  /vessel-visits:
    get:
      tags: [Vessel visits]
      summary: List vessel visits with progress
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, eta, etd, vesselName, createdAt with :asc or :desc'
          schema:
            type: string
            default: eta:asc
        - name: status
          in: query
          schema:
            type: string
            enum: [PLANNED, ARRIVED, WORKING, DEPARTED]
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: One page of visits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselVisitPage'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Vessel visits]
      summary: Create a vessel visit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVesselVisit'
            example:
              vesselName: Baltic Wren
              imoNumber: '9705380'
              voyage: 010E
              eta: '2026-10-03T08:00:00Z'
              etd: '2026-10-03T20:00:00Z'
      responses:
        '201':
          description: Created with status PLANNED
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VesselVisit'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /vessel-visits/{id}:
    get:
      tags: [Vessel visits]
      summary: Visit detail with every discharge and load item
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The visit
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VesselVisitDetail'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Vessel visits]
      summary: Change the schedule or the status
      description: |
        Status goes PLANNED → ARRIVED (sets ata) → WORKING (set by the first discharge or load) → DEPARTED (sets atd).
        Departing with pending load items needs `departWithOpenItems: true` and is audit logged.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVesselVisit'
            examples:
              arrive:
                value:
                  status: ARRIVED
              departWithOpenItems:
                value:
                  status: DEPARTED
                  departWithOpenItems: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VesselVisit'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /vessel-visits/{id}/items:
    post:
      tags: [Vessel visits]
      summary: Add one discharge or load item
      description: A discharge item creates the container as EXPECTED.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitItemInput'
            example:
              containerNumber: CSQU 305438 3
              size: FT40
              isHighCube: true
              loadStatus: FULL
              isDangerous: false
              grossWeightKg: 24500
              ownerCode: HNF
              direction: DISCHARGE
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VisitItem'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /vessel-visits/{id}/items/import:
    post:
      tags: [Vessel visits]
      summary: Import discharge and load items from CSV
      description: |
        Send the file content as the body with `Content-Type: text/csv`. Columns, in any order:
        `containerNumber,size,isHighCube,loadStatus,isDangerous,imoClass,grossWeightKg,ownerCode,direction`.
        If any line is invalid, nothing is imported and every problem is reported with its line number.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
            example: |
              containerNumber,size,isHighCube,loadStatus,isDangerous,imoClass,grossWeightKg,ownerCode,direction
              CSQU3054383,FT40,true,FULL,false,,24500,HNF,DISCHARGE
      responses:
        '201':
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imported:
                        type: integer
                      discharge:
                        type: integer
                      load:
                        type: integer
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: One or more lines are invalid, nothing was imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_FAILED
                  message: 1 line has problems, nothing was imported
                  details:
                    - line: 3
                      field: containerNumber
                      message: 'Invalid container number: check digit does not match'

  /vessel-visits/{id}/items/{itemId}/discharge:
    post:
      tags: [Vessel visits]
      summary: Confirm the discharge of one item into a chosen slot
      description: |
        Pick a slot from `POST /yard/suggestions`, or any stack or position that passes the stacking rules.
        The container becomes IN_YARD, the owner is notified, and the visit becomes WORKING.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  examples: [B-02-05-2]
      responses:
        '200':
          description: Discharged
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CargoResult'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /vessel-visits/{id}/items/{itemId}/load:
    post:
      tags: [Vessel visits]
      summary: Confirm the load of one item
      description: |
        The container must be in the yard without an active customs hold. If containers sit on top of it,
        relocation work orders are created and the answer is 409 RELOCATION_PENDING with the work orders in details.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Loaded, the container is DEPARTED
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CargoResult'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Hold, not in yard, or waiting for relocations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: RELOCATION_PENDING
                  message: Waiting for 2 relocations
                  details: []

  /containers:
    get:
      tags: [Containers]
      summary: Search and filter containers
      description: Admin, Planner, Gate Operator and Customer. Customers only ever see their own company.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of number, gateInAt, createdAt, departedAt with :asc or :desc'
          schema:
            type: string
            default: number:asc
        - name: search
          in: query
          description: Part of the container number, spaces and case are ignored
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [EXPECTED, IN_YARD, DEPARTED]
        - name: size
          in: query
          schema:
            $ref: '#/components/schemas/ContainerSize'
        - name: loadStatus
          in: query
          schema:
            type: string
            enum: [FULL, EMPTY]
        - name: isDangerous
          in: query
          schema:
            type: string
            enum: ['true', 'false']
        - name: hasHold
          in: query
          schema:
            type: string
            enum: ['true', 'false']
        - name: ownerCode
          in: query
          description: Company code, staff only
          schema:
            type: string
        - name: blockCode
          in: query
          schema:
            type: string
      responses:
        '200':
          description: One page of containers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerPage'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /containers/{number}:
    get:
      tags: [Containers]
      summary: Container detail with position, holds, invoices and history
      description: A customer asking for another company's container gets 404, so ids do not leak.
      parameters:
        - name: number
          in: path
          required: true
          description: ISO 6346 number, spaces and case are ignored
          schema:
            type: string
            examples: [HNFU2045711]
      responses:
        '200':
          description: The container
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContainerDetail'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The number fails ISO 6346
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_FAILED
                  message: Validation failed
                  details:
                    - field: params.number
                      message: 'Invalid container number: check digit does not match'

  /yard/map:
    get:
      tags: [Yard]
      summary: All blocks with every stack
      description: Admin, Planner and Gate Operator.
      responses:
        '200':
          description: Blocks with geometry, occupancy and stacks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapBlock'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /yard/stacks/{block}/{row}/{bay}:
    get:
      tags: [Yard]
      summary: Side view of one stack, bottom tier first
      parameters:
        - name: block
          in: path
          required: true
          schema:
            type: string
            examples: [B]
        - name: row
          in: path
          required: true
          schema:
            type: integer
        - name: bay
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The stack
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StackView'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /yard/suggestions:
    post:
      tags: [Yard]
      summary: Top 3 slots for a container
      description: |
        Filters blocks by type and size class, drops full stacks and stacks with a different size on top,
        then scores each stack: 100, plus 15 if partly filled, plus 20 if the same owner is on top,
        minus 8 per tier of height, minus floor(distance to gate / 10).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionRequest'
            example:
              size: FT40
              loadStatus: FULL
              isDangerous: false
              ownerCompanyId: 1
      responses:
        '200':
          description: Up to 3 suggestions, best first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Suggestion'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: No free slot for this container type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /yard/moves:
    post:
      tags: [Yard]
      summary: Move a top container to another stack
      description: |
        Admin and Planner. Only the top container of a stack can move. The target is a stack (B-02-05)
        or a position (B-02-05-2); the tier is always the stack height plus one.
        A broken stacking rule answers 409 STACKING_RULE_BROKEN with the rule in the message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
            example:
              containerNumber: HNFU 204571 1
              to: B-02-05
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MoveResult'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Blocked, rule broken, or slot just taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                blocked:
                  value:
                    error:
                      code: CONTAINER_BLOCKED
                      message: Container is blocked by 2 containers above it
                      details: []
                taken:
                  value:
                    error:
                      code: SLOT_TAKEN
                      message: Slot was just taken, please pick another
                      details: []
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /work-orders:
    get:
      tags: [Work orders]
      summary: List work orders
      description: Admin and Planner.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, createdAt, completedAt with :asc or :desc'
          schema:
            type: string
            default: id:asc
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, DONE, CANCELLED]
        - name: groupKey
          in: query
          schema:
            type: string
            format: uuid
        - name: containerNumber
          in: query
          description: The moved container or the container the group clears the way for
          schema:
            type: string
      responses:
        '200':
          description: One page of work orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderPage'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /work-orders/{id}/complete:
    post:
      tags: [Work orders]
      summary: Complete a work order in sequence
      description: |
        Moves the container to its planned slot as a RELOCATION. If the planned slot is no longer valid,
        the next best slot is used and the reason is written to the audit log.
        Sequence 1 of a group must be done before sequence 2.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkOrder'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, name, email, role, createdAt, lastLoginAt with :asc or :desc'
          schema:
            type: string
            default: name:asc
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: companyId
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/IsActive'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Users]
      summary: Create a user
      description: Customers need a companyId. Staff users must not have one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
            example:
              email: new.planner@yardflow.dev
              name: Nina Weber
              password: change-me-123
              role: PLANNER
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /users/{id}:
    patch:
      tags: [Users]
      summary: Update, activate or deactivate a user
      description: Deactivating a user ends all of their sessions at once. Admins cannot deactivate themselves or remove their own admin role.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
            example:
              isActive: false
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /companies:
    get:
      tags: [Companies]
      summary: List companies
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, code, name, createdAt with :asc or :desc'
          schema:
            type: string
            default: name:asc
        - $ref: '#/components/parameters/IsActive'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: One page of companies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPage'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Companies]
      summary: Create a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompany'
            example:
              code: KIL
              name: Kiel Box Logistics
              contactEmail: ops@kielbox.example
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /companies/{id}:
    patch:
      tags: [Companies]
      summary: Update a company
      description: The code cannot change. Deactivating a company logs out its customers and blocks their login.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompany'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /blocks:
    get:
      tags: [Blocks]
      summary: Blocks with geometry and occupancy
      description: Admin, Planner and Gate Operator.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, code, gateDistanceM with :asc or :desc'
          schema:
            type: string
            default: code:asc
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/BlockType'
        - name: sizeClass
          in: query
          schema:
            $ref: '#/components/schemas/BlockSizeClass'
      responses:
        '200':
          description: One page of blocks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockPage'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Blocks]
      summary: Create a block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBlock'
            example:
              code: F
              type: STANDARD
              sizeClass: LARGE
              rows: 5
              bays: 10
              maxTier: 4
              mapX: 500
              mapY: 20
              gateDistanceM: 480
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /blocks/{id}:
    patch:
      tags: [Blocks]
      summary: Change a block
      description: |
        Shrinking is refused with `409 BLOCK_SHRINK_CUTS_STACKS` when an occupied position would fall outside
        the new rows, bays or maximum tier. Type and size class can only change while the block is empty.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBlock'
            example:
              maxTier: 4
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /tariffs:
    get:
      tags: [Tariffs]
      summary: List tariffs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, size, isDangerous with :asc or :desc'
          schema:
            type: string
            default: id:asc
      responses:
        '200':
          description: One page of tariffs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffPage'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Tariffs]
      summary: Change one tariff
      description: The tariff is identified by size and isDangerous. Send freeDays, dailyRateCents or both.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTariff'
            example:
              size: FT40
              isDangerous: false
              dailyRateCents: 1600
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tariff'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /time-slots:
    get:
      tags: [Time slots]
      summary: Slots of one day with remaining capacity
      description: |
        Admin and Customer. Slots run hourly from 08:00 to 17:00 Europe/Berlin, Monday to Saturday.
        Slots from today up to 14 days ahead are created on first request. Bookings count when ACTIVE or USED.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            examples: ['2026-10-01']
      responses:
        '200':
          description: The slots of the day, empty on Sunday
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimeSlot'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    patch:
      tags: [Time slots]
      summary: Change the capacity of one slot or a whole day
      description: Send slotId or date, not both. Capacity can never be lower than the bookings of a slot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCapacity'
            example:
              date: '2026-10-01'
              capacity: 12
      responses:
        '200':
          description: The changed slots
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimeSlot'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /health:
    get:
      tags: [System]
      summary: Liveness and database check
      security: []
      responses:
        '200':
          description: The API runs and the database answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The database does not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: Rate limited to 10 attempts per 15 minutes per IP address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@yardflow.dev
              password: demo1234
      responses:
        '200':
          description: Logged in. The response sets the session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: httpOnly session cookie `yardflow.sid`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          description: Email or password is incorrect, or the user is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Email or password is incorrect
                  details: []
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out and end the session
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/NotAuthenticated'

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: The logged in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: yardflow.sid

  schemas:
    Role:
      type: string
      enum: [ADMIN, PLANNER, GATE_OPERATOR, CUSTOMER]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              examples: [SLOT_TAKEN]
            message:
              type: string
              examples: [Slot was just taken, please pick another]
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    Health:
      type: object
      required: [status, database, uptimeSeconds]
      properties:
        status:
          type: string
          enum: [ok, error]
        database:
          type: string
          enum: [up, down]
        uptimeSeconds:
          type: integer

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128

    Company:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          examples: [HNF]
        name:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        companyId:
          type: [integer, 'null']
        company:
          oneOf:
            - $ref: '#/components/schemas/Company'
            - type: 'null'
        isActive:
          type: boolean
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/User'

    CreateUser:
      type: object
      additionalProperties: false
      required: [email, name, password, role]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 128
        role:
          $ref: '#/components/schemas/Role'
        companyId:
          type: [integer, 'null']
          description: Required for CUSTOMER, must be null for staff

    UpdateUser:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          minLength: 8
        role:
          $ref: '#/components/schemas/Role'
        companyId:
          type: [integer, 'null']
        isActive:
          type: boolean

    CompanyDetail:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          examples: [HNF]
        name:
          type: string
        contactEmail:
          type: string
          format: email
        isActive:
          type: boolean
        userCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CompanyResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CompanyDetail'

    CompanyPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CompanyDetail'

    CreateCompany:
      type: object
      additionalProperties: false
      required: [code, name, contactEmail]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z]{3}$'
        name:
          type: string
        contactEmail:
          type: string
          format: email

    UpdateCompany:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
        contactEmail:
          type: string
          format: email
        isActive:
          type: boolean

    BlockType:
      type: string
      enum: [STANDARD, EMPTY, DG]

    BlockSizeClass:
      type: string
      enum: [SMALL, LARGE]

    BlockGeometry:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/BlockType'
        sizeClass:
          $ref: '#/components/schemas/BlockSizeClass'
        rows:
          type: integer
          minimum: 1
          maximum: 99
        bays:
          type: integer
          minimum: 1
          maximum: 99
        maxTier:
          type: integer
          minimum: 1
          maximum: 9
        mapX:
          type: integer
        mapY:
          type: integer
        gateDistanceM:
          type: integer

    Block:
      allOf:
        - type: object
          properties:
            id:
              type: integer
            code:
              type: string
              examples: [B]
        - $ref: '#/components/schemas/BlockGeometry'
        - type: object
          properties:
            occupancy:
              type: object
              properties:
                capacitySlots:
                  type: integer
                usedSlots:
                  type: integer
                freeSlots:
                  type: integer
                occupancyPercent:
                  type: number
                teuCapacity:
                  type: integer
                teuUsed:
                  type: integer

    BlockResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Block'

    BlockPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Block'

    CreateBlock:
      allOf:
        - type: object
          required: [code, type, sizeClass, rows, bays, maxTier, mapX, mapY, gateDistanceM]
          properties:
            code:
              type: string
              pattern: '^[A-Za-z][A-Za-z0-9]?$'
        - $ref: '#/components/schemas/BlockGeometry'

    UpdateBlock:
      allOf:
        - $ref: '#/components/schemas/BlockGeometry'
        - type: object
          minProperties: 1

    Tariff:
      type: object
      properties:
        id:
          type: integer
        size:
          type: string
          enum: [FT20, FT40, FT45]
        isDangerous:
          type: boolean
        freeDays:
          type: integer
        dailyRateCents:
          type: integer
          description: Euro cents per chargeable day

    TariffPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Tariff'

    UpdateTariff:
      type: object
      additionalProperties: false
      required: [size, isDangerous]
      properties:
        size:
          type: string
          enum: [FT20, FT40, FT45]
        isDangerous:
          type: boolean
        freeDays:
          type: integer
          minimum: 0
          maximum: 365
        dailyRateCents:
          type: integer
          minimum: 0

    TimeSlot:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        startHour:
          type: integer
          minimum: 8
          maximum: 16
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        capacity:
          type: integer
        booked:
          type: integer
        remaining:
          type: integer
        isFull:
          type: boolean

    UpdateCapacity:
      type: object
      additionalProperties: false
      required: [capacity]
      properties:
        slotId:
          type: integer
        date:
          type: string
          format: date
        capacity:
          type: integer
          minimum: 0
          maximum: 100

    ContainerSize:
      type: string
      enum: [FT20, FT40, FT45]

    ContainerSummary:
      type: object
      properties:
        id:
          type: integer
        number:
          type: string
          examples: [HNFU2045711]
        displayNumber:
          type: string
          examples: [HNFU 204571 1]
        size:
          $ref: '#/components/schemas/ContainerSize'
        isHighCube:
          type: boolean
        loadStatus:
          type: string
          enum: [FULL, EMPTY]
        isDangerous:
          type: boolean
        imoClass:
          type: [string, 'null']
        grossWeightKg:
          type: [integer, 'null']
        state:
          type: string
          enum: [EXPECTED, IN_YARD, DEPARTED]
        gateInAt:
          type: [string, 'null']
          format: date-time
        departedAt:
          type: [string, 'null']
          format: date-time
        dwellDays:
          type: [integer, 'null']
        owner:
          $ref: '#/components/schemas/Company'
        positionCode:
          type: [string, 'null']
          examples: [B-02-03-1]
        hasHold:
          type: boolean

    ContainerDetail:
      allOf:
        - $ref: '#/components/schemas/ContainerSummary'
        - type: object
          properties:
            holds:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  reason:
                    type: string
                  placedAt:
                    type: string
                    format: date-time
                  releasedAt:
                    type: [string, 'null']
                    format: date-time
                  isActive:
                    type: boolean
            invoices:
              type: array
              items:
                type: object
                properties:
                  number:
                    type: string
                  amountCents:
                    type: integer
                  status:
                    type: string
                    enum: [UNPAID, PAID, VOID]
            history:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum: [GATE_IN, GATE_OUT, DISCHARGE, LOAD, YARD_MOVE, RELOCATION]
                  fromPosition:
                    type: [string, 'null']
                  toPosition:
                    type: [string, 'null']
                  at:
                    type: string
                    format: date-time
            openWorkOrders:
              description: Staff only
              type: array
              items:
                $ref: '#/components/schemas/WorkOrder'

    ContainerPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ContainerSummary'

    MapBlock:
      allOf:
        - $ref: '#/components/schemas/Block'
        - type: object
          properties:
            stacks:
              type: array
              items:
                type: object
                properties:
                  row:
                    type: integer
                  bay:
                    type: integer
                  stackCode:
                    type: string
                    examples: [B-02-05]
                  height:
                    type: integer
                  topSize:
                    oneOf:
                      - $ref: '#/components/schemas/ContainerSize'
                      - type: 'null'
                  hasHold:
                    type: boolean
                  hasDangerous:
                    type: boolean

    StackView:
      type: object
      properties:
        blockCode:
          type: string
        row:
          type: integer
        bay:
          type: integer
        stackCode:
          type: string
        maxTier:
          type: integer
        height:
          type: integer
        tiers:
          type: array
          items:
            type: object
            properties:
              tier:
                type: integer
              positionCode:
                type: string
              container:
                type: object
                properties:
                  number:
                    type: string
                  size:
                    $ref: '#/components/schemas/ContainerSize'
                  owner:
                    $ref: '#/components/schemas/Company'
                  hasHold:
                    type: boolean

    SuggestionRequest:
      type: object
      additionalProperties: false
      required: [size, loadStatus]
      properties:
        size:
          $ref: '#/components/schemas/ContainerSize'
        loadStatus:
          type: string
          enum: [FULL, EMPTY]
        isDangerous:
          type: boolean
          default: false
        ownerCompanyId:
          type: [integer, 'null']

    Suggestion:
      type: object
      properties:
        blockCode:
          type: string
        row:
          type: integer
        bay:
          type: integer
        tier:
          type: integer
        positionCode:
          type: string
          examples: [B-01-01-2]
        score:
          type: integer
          examples: [123]
        distanceM:
          type: integer
          examples: [40]
        maxTier:
          type: integer
        reasons:
          type: array
          items:
            type: string
          examples: [[Same owner below, Partly filled, Tier 2 of 5, 40 m to gate]]

    MoveRequest:
      type: object
      additionalProperties: false
      required: [containerNumber, to]
      properties:
        containerNumber:
          type: string
        to:
          type: string
          description: A stack like B-02-05 or a position like B-02-05-2

    MoveResult:
      type: object
      properties:
        containerNumber:
          type: string
        fromPosition:
          type: string
        toPosition:
          type: string

    WorkOrder:
      type: object
      properties:
        id:
          type: integer
        groupKey:
          type: string
          format: uuid
        sequence:
          type: integer
        status:
          type: string
          enum: [OPEN, DONE, CANCELLED]
        reason:
          type: string
        containerNumber:
          type: string
        targetContainerNumber:
          type: string
        fromPosition:
          type: string
        toPosition:
          type: string
        completedBy:
          oneOf:
            - type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
            - type: 'null'
        completedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    WorkOrderPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/WorkOrder'

    CargoCount:
      type: object
      properties:
        total:
          type: integer
        done:
          type: integer

    VesselVisit:
      type: object
      properties:
        id:
          type: integer
        vesselName:
          type: string
        imoNumber:
          type: string
          pattern: '^\d{7}$'
        voyage:
          type: string
        eta:
          type: string
          format: date-time
        etd:
          type: string
          format: date-time
        ata:
          type: [string, 'null']
          format: date-time
        atd:
          type: [string, 'null']
          format: date-time
        status:
          type: string
          enum: [PLANNED, ARRIVED, WORKING, DEPARTED]
        discharge:
          $ref: '#/components/schemas/CargoCount'
        load:
          $ref: '#/components/schemas/CargoCount'
        progressPercent:
          type: integer

    VesselVisitPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/VesselVisit'

    VesselVisitDetail:
      allOf:
        - $ref: '#/components/schemas/VesselVisit'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/VisitItem'

    CreateVesselVisit:
      type: object
      additionalProperties: false
      required: [vesselName, imoNumber, voyage, eta, etd]
      properties:
        vesselName:
          type: string
        imoNumber:
          type: string
          pattern: '^\d{7}$'
        voyage:
          type: string
          maxLength: 10
        eta:
          type: string
          format: date-time
        etd:
          type: string
          format: date-time

    UpdateVesselVisit:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        vesselName:
          type: string
        imoNumber:
          type: string
        voyage:
          type: string
        eta:
          type: string
          format: date-time
        etd:
          type: string
          format: date-time
        status:
          type: string
          enum: [ARRIVED, DEPARTED]
        departWithOpenItems:
          type: boolean

    VisitItemInput:
      type: object
      additionalProperties: false
      required: [containerNumber, size, loadStatus, ownerCode, direction]
      properties:
        containerNumber:
          type: string
        size:
          $ref: '#/components/schemas/ContainerSize'
        isHighCube:
          type: boolean
          default: false
        loadStatus:
          type: string
          enum: [FULL, EMPTY]
        isDangerous:
          type: boolean
          default: false
        imoClass:
          type: [string, 'null']
          description: Required for dangerous goods, for example 3 or 2.1
        grossWeightKg:
          type: [integer, 'null']
          minimum: 1000
          maximum: 60000
        ownerCode:
          type: string
          examples: [HNF]
        direction:
          type: string
          enum: [DISCHARGE, LOAD]

    VisitItem:
      allOf:
        - $ref: '#/components/schemas/VisitItemInput'
        - type: object
          properties:
            id:
              type: integer
            visitId:
              type: integer
            displayNumber:
              type: string
            owner:
              $ref: '#/components/schemas/Company'
            status:
              type: string
              enum: [PENDING, DONE]
            doneAt:
              type: [string, 'null']
              format: date-time
            containerState:
              type: [string, 'null']
              enum: [EXPECTED, IN_YARD, DEPARTED, null]
            positionCode:
              type: [string, 'null']
            hasHold:
              type: boolean

    CargoResult:
      type: object
      properties:
        itemId:
          type: integer
        containerNumber:
          type: string
        positionCode:
          type: string
          description: Discharge only
        fromPosition:
          type: string
          description: Load only
        visit:
          type: object
          properties:
            visitId:
              type: integer
            status:
              type: string
            doneCount:
              type: integer
            totalCount:
              type: integer

  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IsActive:
      name: isActive
      in: query
      schema:
        type: string
        enum: ['true', 'false']
    Search:
      name: search
      in: query
      description: Part of the name, email or code
      schema:
        type: string

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: A business rule prevents this change
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MalformedRequest:
      description: The body is not valid JSON
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAuthenticated:
      description: Not logged in, or the session has ended
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The user's role may not use this endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: The request failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_FAILED
              message: Validation failed
              details:
                - field: body.email
                  message: Enter a valid email address
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
