openapi: 3.1.0
info:
  title: YardFlow API
  version: 0.1.0
  description: |
    REST API of YardFlow, a container yard management system for one container terminal.

    Log in with `POST /auth/login` first. The API answers with an httpOnly session cookie
    that Swagger UI sends automatically with every following request.

    Demo logins (password `demo1234`): `admin@yardflow.dev`, `planner@yardflow.dev`,
    `gate@yardflow.dev`, `ops@hansenorth.example`, `ops@nordtrans.example`.

    Live updates come over Socket.IO on the same origin (path `/socket.io`), using the same session cookie.
    Staff join the room `staff` and receive `yard:changed`, `gate:event`, `workorder:changed` and `vessel:changed`.
    Customers join `company:<id>` and receive `notification:new` and `container:changed` for their company only.
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Log in, log out and read the current user
  - name: System
    description: Health and liveness
  - name: Users
    description: Staff and customer accounts (Admin)
  - name: Companies
    description: Customer companies (Admin)
  - name: Blocks
    description: Yard blocks with geometry and occupancy
  - name: Tariffs
    description: Storage tariffs per size and dangerous goods flag (Admin)
  - name: Time slots
    description: Hourly gate slots with capacity
  - name: Containers
    description: Search containers and read their detail. Customers see only their own company.
  - name: Yard
    description: Live yard map, stack side view, slot suggestion and moves
  - name: Work orders
    description: Relocation work orders that clear containers above a pickup or load
  - name: Vessel visits
    description: Vessel calls with discharge and load lists (Admin and Planner)
  - name: Pre-advices
    description: Customer truck bookings with a 6-digit PIN
  - name: Gate
    description: Truck and PIN check, gate-in, gate-out checks and completion, EIR tickets
  - name: Customs
    description: Customs holds that block gate-out and loading (Admin)
  - name: Invoices
    description: Storage invoices
  - name: Notifications
    description: Customer notifications. New ones also arrive live over Socket.IO as notification:new.
  - name: Reports
    description: KPIs and chart data (Admin and Planner)
  - name: Exports
    description: CSV exports with the same filters as the list screens
  - name: Audit log
    description: Every change and business action (Admin)

paths:
  /public/stats:
    get:
      tags: [System]
      summary: Public live numbers for the landing page
      description: |
        No login needed. Truck plates and container numbers are masked. Cached for 15 seconds.
        Gate-in time is the average minutes from the PIN check to the completed gate-in over the last 7 days.
      security: []
      responses:
        '200':
          description: The numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      containersInYard:
                        type: integer
                      occupancyPercent:
                        type: number
                      gateMovesToday:
                        type: integer
                      averageDwellDays:
                        type: [number, 'null']
                      averageGateInMinutes:
                        type: [number, 'null']
                      recentGateEvents:
                        type: array
                        items:
                          type: object
                          properties:
                            kind:
                              type: string
                              enum: [IN, OUT]
                            containerNumber:
                              type: string
                              examples: [HNFU •••571 1]
                            size:
                              $ref: '#/components/schemas/ContainerSize'
                            plate:
                              type: string
                              examples: [HH-•• ••2]
                            lane:
                              type: integer
                            at:
                              type: string
                              format: date-time
                      generatedAt:
                        type: string
                        format: date-time

  /reports/kpis:
    get:
      tags: [Reports]
      summary: KPI cards of the Planner overview
      description: |
        Yard occupancy in TEU, gate moves today, trucks expected in the current slot, open work orders with the
        age of the oldest, active customs holds, and the average dwell of containers in the yard.
      responses:
        '200':
          description: The KPIs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Kpis'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/occupancy:
    get:
      tags: [Reports]
      summary: Occupancy per block (bar chart)
      responses:
        '200':
          description: One entry per block
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlockOccupancy'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /reports/gate-moves:
    get:
      tags: [Reports]
      summary: Gate moves per day, in and out (grouped bar chart)
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 14
      responses:
        '200':
          description: One entry per day, oldest first, today last
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        in:
                          type: integer
                        out:
                          type: integer
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /reports/dwell:
    get:
      tags: [Reports]
      summary: Average dwell per week, last 8 weeks (line chart)
      description: Weeks start on Monday in Europe/Berlin. Each week averages the stays of the containers that left in that week.
      responses:
        '200':
          description: One entry per week, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        weekStart:
                          type: string
                          format: date
                        departures:
                          type: integer
                        averageDwellDays:
                          type: [number, 'null']
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /exports/containers.csv:
    get:
      tags: [Exports]
      summary: Containers as CSV
      description: Admin and Planner. Takes the filters of GET /containers.
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [EXPECTED, IN_YARD, DEPARTED]
        - name: blockCode
          in: query
          schema:
            type: string
        - name: ownerCode
          in: query
          schema:
            type: string
        - name: hasHold
          in: query
          schema:
            type: string
            enum: ['true', 'false']
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Csv'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /exports/movements.csv:
    get:
      tags: [Exports]
      summary: Movements as CSV
      description: Admin and Planner.
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [GATE_IN, GATE_OUT, DISCHARGE, LOAD, YARD_MOVE, RELOCATION]
        - name: containerNumber
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          $ref: '#/components/responses/Csv'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /exports/invoices.csv:
    get:
      tags: [Exports]
      summary: Storage invoices as CSV
      description: Admin only. Takes the filters of GET /invoices.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [UNPAID, PAID, VOID]
        - name: companyCode
          in: query
          schema:
            type: string
        - name: containerNumber
          in: query
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Csv'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /audit-logs:
    get:
      tags: [Audit log]
      summary: Search the audit log
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, createdAt with :asc or :desc'
          schema:
            type: string
            default: createdAt:desc
        - $ref: '#/components/parameters/AuditUserId'
        - $ref: '#/components/parameters/AuditEntity'
        - $ref: '#/components/parameters/AuditEntityId'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: One page of audit entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLogEntry'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /audit-logs.csv:
    get:
      tags: [Audit log]
      summary: Export the filtered audit log as CSV
      parameters:
        - $ref: '#/components/parameters/AuditUserId'
        - $ref: '#/components/parameters/AuditEntity'
        - $ref: '#/components/parameters/AuditEntityId'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          $ref: '#/components/responses/Csv'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /customs-holds:
    get:
      tags: [Customs]
      summary: List customs holds
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, placedAt, releasedAt with :asc or :desc'
          schema:
            type: string
            default: placedAt:desc
        - $ref: '#/components/parameters/IsActive'
        - name: containerNumber
          in: query
          schema:
            type: string
      responses:
        '200':
          description: One page of holds
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CustomsHold'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Customs]
      summary: Place a customs hold
      description: Only on an EXPECTED or IN_YARD container, and only one active hold at a time. The owner company is notified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [containerNumber, reason]
              properties:
                containerNumber:
                  type: string
                reason:
                  type: string
                  minLength: 3
                  maxLength: 200
            example:
              containerNumber: HNFU 204571 1
              reason: X-ray inspection requested
      responses:
        '201':
          description: Placed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CustomsHold'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /customs-holds/{id}/release:
    post:
      tags: [Customs]
      summary: Release an active customs hold
      description: Notifies the owner, and also sends READY_FOR_PICKUP when the container has an active pickup pre-advice.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Released
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CustomsHold'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /invoices:
    get:
      tags: [Invoices]
      summary: List storage invoices
      description: Admin and Customer. Customers only ever see invoices of their own company.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, createdAt, amountCents, number with :asc or :desc'
          schema:
            type: string
            default: createdAt:desc
        - name: status
          in: query
          schema:
            type: string
            enum: [UNPAID, PAID, VOID]
        - name: containerNumber
          in: query
          schema:
            type: string
        - name: companyCode
          in: query
          description: Admin only
          schema:
            type: string
      responses:
        '200':
          description: One page of invoices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/InvoiceDetail'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /invoices/{id}/mark-paid:
    post:
      tags: [Invoices]
      summary: Mark an unpaid invoice as paid
      description: Admin only. Notifies the company with INVOICE_PAID.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Paid
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/InvoiceDetail'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /invoices/{id}/pdf:
    get:
      tags: [Invoices]
      summary: Storage invoice as PDF
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications:
    get:
      tags: [Notifications]
      summary: Notifications of the own company
      description: Customer only. The response also contains the unread count for the badge.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, createdAt with :asc or :desc'
          schema:
            type: string
            default: createdAt:desc
        - name: unread
          in: query
          schema:
            type: string
            enum: ['true', 'false']
        - name: type
          in: query
          schema:
            type: string
            enum:
              [
                CONTAINER_IN_YARD,
                READY_FOR_PICKUP,
                CUSTOMS_HOLD_PLACED,
                CUSTOMS_HOLD_RELEASED,
                INVOICE_ISSUED,
                INVOICE_PAID,
                GATE_OUT_DONE,
                PRE_ADVICE_EXPIRED,
              ]
      responses:
        '200':
          description: One page of notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      unreadCount:
                        type: integer
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark one notification as read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Read
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all own notifications as read
      responses:
        '200':
          description: How many were marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      markedRead:
                        type: integer
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /pre-advices:
    get:
      tags: [Pre-advices]
      summary: List pre-advices
      description: Admin and Customer. Customers see only their own company. Overdue pre-advices expire before the list is read.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, createdAt with :asc or :desc'
          schema:
            type: string
            default: createdAt:desc
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, USED, CANCELLED, EXPIRED]
        - name: type
          in: query
          schema:
            type: string
            enum: [DELIVERY, PICKUP]
        - name: date
          in: query
          description: Date of the booked slot
          schema:
            type: string
            format: date
        - name: search
          in: query
          description: Part of the reference or the container number
          schema:
            type: string
      responses:
        '200':
          description: One page of pre-advices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PreAdvice'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Pre-advices]
      summary: Book a time slot for a delivery or pickup
      description: |
        Customer only, for its own company. Returns the 6-digit PIN exactly once.
        A pickup needs a container of the company in the yard and issues a storage invoice up to the end of the slot.
        A delivery needs the container data and records the container as EXPECTED.
        Slots can be booked from 60 minutes before they start up to 14 days ahead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePreAdvice'
            examples:
              pickup:
                value:
                  type: PICKUP
                  timeSlotId: 1
                  containerNumber: HNFU 204571 1
                  truckPlate: HH-YF 482
                  driverName: Jan Becker
              delivery:
                value:
                  type: DELIVERY
                  timeSlotId: 1
                  containerNumber: CSQU 305438 3
                  truckPlate: HH-YF 175
                  driverName: Mats Olsen
                  size: FT40
                  isHighCube: true
                  loadStatus: FULL
                  isDangerous: false
                  imoClass: null
                  grossWeightKg: 21000
      responses:
        '201':
          description: Booked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PreAdviceWithPin'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /pre-advices/{id}/regenerate-pin:
    post:
      tags: [Pre-advices]
      summary: Replace the PIN of an active pre-advice
      description: Customer only. The old PIN stops working, the new one is shown once.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: New PIN
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PreAdviceWithPin'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /pre-advices/{id}/cancel:
    post:
      tags: [Pre-advices]
      summary: Cancel an active pre-advice
      description: Admin or the owning customer. Cancelling a pickup cancels its open relocation work orders.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PreAdvice'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /gate/verify-truck:
    post:
      tags: [Gate]
      summary: Check truck plate and PIN (step 1 of gate-in and gate-out)
      description: |
        Admin and Gate Operator. Finds the active pre-advice of this plate whose slot is today and whose window
        (slot start minus 30 minutes to slot end plus 30 minutes) contains now. Five wrong PINs for one plate
        within 15 minutes lock the plate for 15 minutes. A successful check is remembered in the session for 30 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [truckPlate, pin, direction]
              properties:
                truckPlate:
                  type: string
                pin:
                  type: string
                  pattern: '^\d{6}$'
                direction:
                  type: string
                  enum: [IN, OUT]
            example:
              truckPlate: HH-YF 482
              pin: '482913'
              direction: OUT
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      preAdvice:
                        $ref: '#/components/schemas/PreAdvice'
                      container:
                        description: Pickup only, with position and hold flag
                        type: [object, 'null']
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Wrong PIN, with the attempts left
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /gate/in:
    post:
      tags: [Gate]
      summary: Complete a gate-in with inspection and slot
      description: |
        Needs a verified truck. Mark damage per side or tick noDamage. The target is a suggested slot or a manual
        stack or position that passes the stacking rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateInRequest'
            example:
              preAdviceId: 1
              containerNumber: CSQU 305438 3
              lane: 1
              damages:
                - side: LEFT
                  code: DENT
                  note: Small dent near the door
              to: B-02-05
      responses:
        '201':
          description: Gated in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GateResult'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /gate/out/check:
    post:
      tags: [Gate]
      summary: Run the four gate-out checks
      description: |
        Needs a verified truck. Checks: valid pre-advice in the slot window, plate and driver match,
        no active customs hold, storage invoice paid up to now. A truck later than the paid period gets an
        invoice for the extra days. When all pass and containers sit on top, relocation work orders are created.
        A failed check is audit logged as GATE_OUT_DENIED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateOutRequest'
      responses:
        '200':
          description: The result of every check
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GateOutCheckResult'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /gate/out:
    post:
      tags: [Gate]
      summary: Complete a gate-out
      description: Runs the checks again. Refused while a check fails or a relocation is open.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateOutRequest'
            example:
              preAdviceId: 1
              truckPlate: HH-YF 482
              driverName: Jan Becker
              lane: 2
      responses:
        '201':
          description: Gated out
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GateResult'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /gate/transactions:
    get:
      tags: [Gate]
      summary: Gate transaction history
      description: Admin, Planner and Gate Operator.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, createdAt with :asc or :desc'
          schema:
            type: string
            default: createdAt:desc
        - name: direction
          in: query
          schema:
            type: string
            enum: [IN, OUT]
        - name: date
          in: query
          description: Day in Europe/Berlin
          schema:
            type: string
            format: date
        - name: containerNumber
          in: query
          schema:
            type: string
      responses:
        '200':
          description: One page of gate transactions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GateTransaction'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /gate/transactions/{id}/eir.pdf:
    get:
      tags: [Gate]
      summary: EIR gate ticket as PDF
      description: Staff, and customers for their own company only.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /vessel-visits:
    get:
      tags: [Vessel visits]
      summary: List vessel visits with progress
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, eta, etd, vesselName, createdAt with :asc or :desc'
          schema:
            type: string
            default: eta:asc
        - name: status
          in: query
          schema:
            type: string
            enum: [PLANNED, ARRIVED, WORKING, DEPARTED]
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: One page of visits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselVisitPage'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Vessel visits]
      summary: Create a vessel visit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVesselVisit'
            example:
              vesselName: Baltic Wren
              imoNumber: '9705380'
              voyage: 010E
              eta: '2026-10-03T08:00:00Z'
              etd: '2026-10-03T20:00:00Z'
      responses:
        '201':
          description: Created with status PLANNED
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VesselVisit'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /vessel-visits/{id}:
    get:
      tags: [Vessel visits]
      summary: Visit detail with every discharge and load item
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The visit
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VesselVisitDetail'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Vessel visits]
      summary: Change the schedule or the status
      description: |
        Status goes PLANNED → ARRIVED (sets ata) → WORKING (set by the first discharge or load) → DEPARTED (sets atd).
        Departing with pending load items needs `departWithOpenItems: true` and is audit logged.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVesselVisit'
            examples:
              arrive:
                value:
                  status: ARRIVED
              departWithOpenItems:
                value:
                  status: DEPARTED
                  departWithOpenItems: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VesselVisit'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /vessel-visits/{id}/items:
    post:
      tags: [Vessel visits]
      summary: Add one discharge or load item
      description: A discharge item creates the container as EXPECTED.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitItemInput'
            example:
              containerNumber: CSQU 305438 3
              size: FT40
              isHighCube: true
              loadStatus: FULL
              isDangerous: false
              grossWeightKg: 24500
              ownerCode: HNF
              direction: DISCHARGE
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VisitItem'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /vessel-visits/{id}/items/import:
    post:
      tags: [Vessel visits]
      summary: Import discharge and load items from CSV
      description: |
        Send the file content as the body with `Content-Type: text/csv`. Columns, in any order:
        `containerNumber,size,isHighCube,loadStatus,isDangerous,imoClass,grossWeightKg,ownerCode,direction`.
        If any line is invalid, nothing is imported and every problem is reported with its line number.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
            example: |
              containerNumber,size,isHighCube,loadStatus,isDangerous,imoClass,grossWeightKg,ownerCode,direction
              CSQU3054383,FT40,true,FULL,false,,24500,HNF,DISCHARGE
      responses:
        '201':
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      imported:
                        type: integer
                      discharge:
                        type: integer
                      load:
                        type: integer
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: One or more lines are invalid, nothing was imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_FAILED
                  message: 1 line has problems, nothing was imported
                  details:
                    - line: 3
                      field: containerNumber
                      message: 'Invalid container number: check digit does not match'

  /vessel-visits/{id}/items/{itemId}/discharge:
    post:
      tags: [Vessel visits]
      summary: Confirm the discharge of one item into a chosen slot
      description: |
        Pick a slot from `POST /yard/suggestions`, or any stack or position that passes the stacking rules.
        The container becomes IN_YARD, the owner is notified, and the visit becomes WORKING.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  examples: [B-02-05-2]
      responses:
        '200':
          description: Discharged
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CargoResult'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /vessel-visits/{id}/items/{itemId}/load:
    post:
      tags: [Vessel visits]
      summary: Confirm the load of one item
      description: |
        The container must be in the yard without an active customs hold. If containers sit on top of it,
        relocation work orders are created and the answer is 409 RELOCATION_PENDING with the work orders in details.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Loaded, the container is DEPARTED
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CargoResult'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Hold, not in yard, or waiting for relocations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: RELOCATION_PENDING
                  message: Waiting for 2 relocations
                  details: []

  /containers:
    get:
      tags: [Containers]
      summary: Search and filter containers
      description: Admin, Planner, Gate Operator and Customer. Customers only ever see their own company.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of number, gateInAt, createdAt, departedAt with :asc or :desc'
          schema:
            type: string
            default: number:asc
        - name: search
          in: query
          description: Part of the container number, spaces and case are ignored
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [EXPECTED, IN_YARD, DEPARTED]
        - name: size
          in: query
          schema:
            $ref: '#/components/schemas/ContainerSize'
        - name: loadStatus
          in: query
          schema:
            type: string
            enum: [FULL, EMPTY]
        - name: isDangerous
          in: query
          schema:
            type: string
            enum: ['true', 'false']
        - name: hasHold
          in: query
          schema:
            type: string
            enum: ['true', 'false']
        - name: ownerCode
          in: query
          description: Company code, staff only
          schema:
            type: string
        - name: blockCode
          in: query
          schema:
            type: string
      responses:
        '200':
          description: One page of containers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerPage'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /containers/{number}:
    get:
      tags: [Containers]
      summary: Container detail with position, holds, invoices and history
      description: A customer asking for another company's container gets 404, so ids do not leak.
      parameters:
        - name: number
          in: path
          required: true
          description: ISO 6346 number, spaces and case are ignored
          schema:
            type: string
            examples: [HNFU2045711]
      responses:
        '200':
          description: The container
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContainerDetail'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The number fails ISO 6346
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_FAILED
                  message: Validation failed
                  details:
                    - field: params.number
                      message: 'Invalid container number: check digit does not match'

  /yard/map:
    get:
      tags: [Yard]
      summary: All blocks with every stack
      description: Admin, Planner and Gate Operator.
      responses:
        '200':
          description: Blocks with geometry, occupancy and stacks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapBlock'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /yard/stacks/{block}/{row}/{bay}:
    get:
      tags: [Yard]
      summary: Side view of one stack, bottom tier first
      parameters:
        - name: block
          in: path
          required: true
          schema:
            type: string
            examples: [B]
        - name: row
          in: path
          required: true
          schema:
            type: integer
        - name: bay
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The stack
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StackView'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /yard/suggestions:
    post:
      tags: [Yard]
      summary: Top 3 slots for a container
      description: |
        Filters blocks by type and size class, drops full stacks and stacks with a different size on top,
        then scores each stack: 100, plus 15 if partly filled, plus 20 if the same owner is on top,
        minus 8 per tier of height, minus floor(distance to gate / 10).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionRequest'
            example:
              size: FT40
              loadStatus: FULL
              isDangerous: false
              ownerCompanyId: 1
      responses:
        '200':
          description: Up to 3 suggestions, best first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Suggestion'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: No free slot for this container type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /yard/moves:
    post:
      tags: [Yard]
      summary: Move a top container to another stack
      description: |
        Admin and Planner. Only the top container of a stack can move. The target is a stack (B-02-05)
        or a position (B-02-05-2); the tier is always the stack height plus one.
        A broken stacking rule answers 409 STACKING_RULE_BROKEN with the rule in the message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
            example:
              containerNumber: HNFU 204571 1
              to: B-02-05
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MoveResult'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Blocked, rule broken, or slot just taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                blocked:
                  value:
                    error:
                      code: CONTAINER_BLOCKED
                      message: Container is blocked by 2 containers above it
                      details: []
                taken:
                  value:
                    error:
                      code: SLOT_TAKEN
                      message: Slot was just taken, please pick another
                      details: []
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /work-orders:
    get:
      tags: [Work orders]
      summary: List work orders
      description: Admin and Planner.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, createdAt, completedAt with :asc or :desc'
          schema:
            type: string
            default: id:asc
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, DONE, CANCELLED]
        - name: groupKey
          in: query
          schema:
            type: string
            format: uuid
        - name: containerNumber
          in: query
          description: The moved container or the container the group clears the way for
          schema:
            type: string
      responses:
        '200':
          description: One page of work orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderPage'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /work-orders/{id}/complete:
    post:
      tags: [Work orders]
      summary: Complete a work order in sequence
      description: |
        Moves the container to its planned slot as a RELOCATION. If the planned slot is no longer valid,
        the next best slot is used and the reason is written to the audit log.
        Sequence 1 of a group must be done before sequence 2.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkOrder'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, name, email, role, createdAt, lastLoginAt with :asc or :desc'
          schema:
            type: string
            default: name:asc
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: companyId
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/IsActive'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Users]
      summary: Create a user
      description: Customers need a companyId. Staff users must not have one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
            example:
              email: new.planner@yardflow.dev
              name: Nina Weber
              password: change-me-123
              role: PLANNER
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /users/{id}:
    patch:
      tags: [Users]
      summary: Update, activate or deactivate a user
      description: Deactivating a user ends all of their sessions at once. Admins cannot deactivate themselves or remove their own admin role.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
            example:
              isActive: false
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /companies:
    get:
      tags: [Companies]
      summary: List companies
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, code, name, createdAt with :asc or :desc'
          schema:
            type: string
            default: name:asc
        - $ref: '#/components/parameters/IsActive'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: One page of companies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPage'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Companies]
      summary: Create a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompany'
            example:
              code: KIL
              name: Kiel Box Logistics
              contactEmail: ops@kielbox.example
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /companies/{id}:
    patch:
      tags: [Companies]
      summary: Update a company
      description: The code cannot change. Deactivating a company logs out its customers and blocks their login.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompany'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /blocks:
    get:
      tags: [Blocks]
      summary: Blocks with geometry and occupancy
      description: Admin, Planner and Gate Operator.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, code, gateDistanceM with :asc or :desc'
          schema:
            type: string
            default: code:asc
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/BlockType'
        - name: sizeClass
          in: query
          schema:
            $ref: '#/components/schemas/BlockSizeClass'
      responses:
        '200':
          description: One page of blocks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockPage'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Blocks]
      summary: Create a block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBlock'
            example:
              code: F
              type: STANDARD
              sizeClass: LARGE
              rows: 5
              bays: 10
              maxTier: 4
              mapX: 500
              mapY: 20
              gateDistanceM: 480
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /blocks/{id}:
    patch:
      tags: [Blocks]
      summary: Change a block
      description: |
        Shrinking is refused with `409 BLOCK_SHRINK_CUTS_STACKS` when an occupied position would fall outside
        the new rows, bays or maximum tier. Type and size class can only change while the block is empty.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBlock'
            example:
              maxTier: 4
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /tariffs:
    get:
      tags: [Tariffs]
      summary: List tariffs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          description: 'One of id, size, isDangerous with :asc or :desc'
          schema:
            type: string
            default: id:asc
      responses:
        '200':
          description: One page of tariffs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffPage'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Tariffs]
      summary: Change one tariff
      description: The tariff is identified by size and isDangerous. Send freeDays, dailyRateCents or both.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTariff'
            example:
              size: FT40
              isDangerous: false
              dailyRateCents: 1600
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tariff'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /time-slots:
    get:
      tags: [Time slots]
      summary: Slots of one day with remaining capacity
      description: |
        Admin and Customer. Slots run hourly from 08:00 to 17:00 Europe/Berlin, Monday to Saturday.
        Slots from today up to 14 days ahead are created on first request. Bookings count when ACTIVE or USED.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
            examples: ['2026-10-01']
      responses:
        '200':
          description: The slots of the day, empty on Sunday
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimeSlot'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    patch:
      tags: [Time slots]
      summary: Change the capacity of one slot or a whole day
      description: Send slotId or date, not both. Capacity can never be lower than the bookings of a slot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCapacity'
            example:
              date: '2026-10-01'
              capacity: 12
      responses:
        '200':
          description: The changed slots
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimeSlot'
        '401':
          $ref: '#/components/responses/NotAuthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /health:
    get:
      tags: [System]
      summary: Liveness and database check
      security: []
      responses:
        '200':
          description: The API runs and the database answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The database does not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: Rate limited to 10 attempts per 15 minutes per IP address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@yardflow.dev
              password: demo1234
      responses:
        '200':
          description: Logged in. The response sets the session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: httpOnly session cookie `yardflow.sid`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          description: Email or password is incorrect, or the user is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Email or password is incorrect
                  details: []
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out and end the session
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/NotAuthenticated'

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: The logged in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/NotAuthenticated'

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: yardflow.sid

  schemas:
    Role:
      type: string
      enum: [ADMIN, PLANNER, GATE_OPERATOR, CUSTOMER]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              examples: [SLOT_TAKEN]
            message:
              type: string
              examples: [Slot was just taken, please pick another]
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    Health:
      type: object
      required: [status, database, uptimeSeconds]
      properties:
        status:
          type: string
          enum: [ok, error]
        database:
          type: string
          enum: [up, down]
        uptimeSeconds:
          type: integer

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128

    Company:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          examples: [HNF]
        name:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        companyId:
          type: [integer, 'null']
        company:
          oneOf:
            - $ref: '#/components/schemas/Company'
            - type: 'null'
        isActive:
          type: boolean
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/User'

    CreateUser:
      type: object
      additionalProperties: false
      required: [email, name, password, role]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 128
        role:
          $ref: '#/components/schemas/Role'
        companyId:
          type: [integer, 'null']
          description: Required for CUSTOMER, must be null for staff

    UpdateUser:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          minLength: 8
        role:
          $ref: '#/components/schemas/Role'
        companyId:
          type: [integer, 'null']
        isActive:
          type: boolean

    CompanyDetail:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          examples: [HNF]
        name:
          type: string
        contactEmail:
          type: string
          format: email
        isActive:
          type: boolean
        userCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CompanyResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CompanyDetail'

    CompanyPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CompanyDetail'

    CreateCompany:
      type: object
      additionalProperties: false
      required: [code, name, contactEmail]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z]{3}$'
        name:
          type: string
        contactEmail:
          type: string
          format: email

    UpdateCompany:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
        contactEmail:
          type: string
          format: email
        isActive:
          type: boolean

    BlockType:
      type: string
      enum: [STANDARD, EMPTY, DG]

    BlockSizeClass:
      type: string
      enum: [SMALL, LARGE]

    BlockGeometry:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/BlockType'
        sizeClass:
          $ref: '#/components/schemas/BlockSizeClass'
        rows:
          type: integer
          minimum: 1
          maximum: 99
        bays:
          type: integer
          minimum: 1
          maximum: 99
        maxTier:
          type: integer
          minimum: 1
          maximum: 9
        mapX:
          type: integer
        mapY:
          type: integer
        gateDistanceM:
          type: integer

    Block:
      allOf:
        - type: object
          properties:
            id:
              type: integer
            code:
              type: string
              examples: [B]
        - $ref: '#/components/schemas/BlockGeometry'
        - type: object
          properties:
            occupancy:
              type: object
              properties:
                capacitySlots:
                  type: integer
                usedSlots:
                  type: integer
                freeSlots:
                  type: integer
                occupancyPercent:
                  type: number
                teuCapacity:
                  type: integer
                teuUsed:
                  type: integer

    BlockResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Block'

    BlockPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Block'

    CreateBlock:
      allOf:
        - type: object
          required: [code, type, sizeClass, rows, bays, maxTier, mapX, mapY, gateDistanceM]
          properties:
            code:
              type: string
              pattern: '^[A-Za-z][A-Za-z0-9]?$'
        - $ref: '#/components/schemas/BlockGeometry'

    UpdateBlock:
      allOf:
        - $ref: '#/components/schemas/BlockGeometry'
        - type: object
          minProperties: 1

    Tariff:
      type: object
      properties:
        id:
          type: integer
        size:
          type: string
          enum: [FT20, FT40, FT45]
        isDangerous:
          type: boolean
        freeDays:
          type: integer
        dailyRateCents:
          type: integer
          description: Euro cents per chargeable day

    TariffPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Tariff'

    UpdateTariff:
      type: object
      additionalProperties: false
      required: [size, isDangerous]
      properties:
        size:
          type: string
          enum: [FT20, FT40, FT45]
        isDangerous:
          type: boolean
        freeDays:
          type: integer
          minimum: 0
          maximum: 365
        dailyRateCents:
          type: integer
          minimum: 0

    TimeSlot:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        startHour:
          type: integer
          minimum: 8
          maximum: 16
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        capacity:
          type: integer
        booked:
          type: integer
        remaining:
          type: integer
        isFull:
          type: boolean

    UpdateCapacity:
      type: object
      additionalProperties: false
      required: [capacity]
      properties:
        slotId:
          type: integer
        date:
          type: string
          format: date
        capacity:
          type: integer
          minimum: 0
          maximum: 100

    ContainerSize:
      type: string
      enum: [FT20, FT40, FT45]

    ContainerSummary:
      type: object
      properties:
        id:
          type: integer
        number:
          type: string
          examples: [HNFU2045711]
        displayNumber:
          type: string
          examples: [HNFU 204571 1]
        size:
          $ref: '#/components/schemas/ContainerSize'
        isHighCube:
          type: boolean
        loadStatus:
          type: string
          enum: [FULL, EMPTY]
        isDangerous:
          type: boolean
        imoClass:
          type: [string, 'null']
        grossWeightKg:
          type: [integer, 'null']
        state:
          type: string
          enum: [EXPECTED, IN_YARD, DEPARTED]
        gateInAt:
          type: [string, 'null']
          format: date-time
        departedAt:
          type: [string, 'null']
          format: date-time
        dwellDays:
          type: [integer, 'null']
        owner:
          $ref: '#/components/schemas/Company'
        positionCode:
          type: [string, 'null']
          examples: [B-02-03-1]
        hasHold:
          type: boolean

    ContainerDetail:
      allOf:
        - $ref: '#/components/schemas/ContainerSummary'
        - type: object
          properties:
            holds:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  reason:
                    type: string
                  placedAt:
                    type: string
                    format: date-time
                  releasedAt:
                    type: [string, 'null']
                    format: date-time
                  isActive:
                    type: boolean
            invoices:
              type: array
              items:
                type: object
                properties:
                  number:
                    type: string
                  amountCents:
                    type: integer
                  status:
                    type: string
                    enum: [UNPAID, PAID, VOID]
            history:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum: [GATE_IN, GATE_OUT, DISCHARGE, LOAD, YARD_MOVE, RELOCATION]
                  fromPosition:
                    type: [string, 'null']
                  toPosition:
                    type: [string, 'null']
                  at:
                    type: string
                    format: date-time
            openWorkOrders:
              description: Staff only
              type: array
              items:
                $ref: '#/components/schemas/WorkOrder'

    ContainerPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ContainerSummary'

    MapBlock:
      allOf:
        - $ref: '#/components/schemas/Block'
        - type: object
          properties:
            stacks:
              type: array
              items:
                type: object
                properties:
                  row:
                    type: integer
                  bay:
                    type: integer
                  stackCode:
                    type: string
                    examples: [B-02-05]
                  height:
                    type: integer
                  topSize:
                    oneOf:
                      - $ref: '#/components/schemas/ContainerSize'
                      - type: 'null'
                  hasHold:
                    type: boolean
                  hasDangerous:
                    type: boolean

    StackView:
      type: object
      properties:
        blockCode:
          type: string
        row:
          type: integer
        bay:
          type: integer
        stackCode:
          type: string
        maxTier:
          type: integer
        height:
          type: integer
        tiers:
          type: array
          items:
            type: object
            properties:
              tier:
                type: integer
              positionCode:
                type: string
              container:
                type: object
                properties:
                  number:
                    type: string
                  size:
                    $ref: '#/components/schemas/ContainerSize'
                  owner:
                    $ref: '#/components/schemas/Company'
                  hasHold:
                    type: boolean

    SuggestionRequest:
      type: object
      additionalProperties: false
      required: [size, loadStatus]
      properties:
        size:
          $ref: '#/components/schemas/ContainerSize'
        loadStatus:
          type: string
          enum: [FULL, EMPTY]
        isDangerous:
          type: boolean
          default: false
        ownerCompanyId:
          type: [integer, 'null']

    Suggestion:
      type: object
      properties:
        blockCode:
          type: string
        row:
          type: integer
        bay:
          type: integer
        tier:
          type: integer
        positionCode:
          type: string
          examples: [B-01-01-2]
        score:
          type: integer
          examples: [123]
        distanceM:
          type: integer
          examples: [40]
        maxTier:
          type: integer
        reasons:
          type: array
          items:
            type: string
          examples: [[Same owner below, Partly filled, Tier 2 of 5, 40 m to gate]]

    MoveRequest:
      type: object
      additionalProperties: false
      required: [containerNumber, to]
      properties:
        containerNumber:
          type: string
        to:
          type: string
          description: A stack like B-02-05 or a position like B-02-05-2

    MoveResult:
      type: object
      properties:
        containerNumber:
          type: string
        fromPosition:
          type: string
        toPosition:
          type: string

    WorkOrder:
      type: object
      properties:
        id:
          type: integer
        groupKey:
          type: string
          format: uuid
        sequence:
          type: integer
        status:
          type: string
          enum: [OPEN, DONE, CANCELLED]
        reason:
          type: string
        containerNumber:
          type: string
        targetContainerNumber:
          type: string
        fromPosition:
          type: string
        toPosition:
          type: string
        completedBy:
          oneOf:
            - type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
            - type: 'null'
        completedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    WorkOrderPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/WorkOrder'

    CargoCount:
      type: object
      properties:
        total:
          type: integer
        done:
          type: integer

    VesselVisit:
      type: object
      properties:
        id:
          type: integer
        vesselName:
          type: string
        imoNumber:
          type: string
          pattern: '^\d{7}$'
        voyage:
          type: string
        eta:
          type: string
          format: date-time
        etd:
          type: string
          format: date-time
        ata:
          type: [string, 'null']
          format: date-time
        atd:
          type: [string, 'null']
          format: date-time
        status:
          type: string
          enum: [PLANNED, ARRIVED, WORKING, DEPARTED]
        discharge:
          $ref: '#/components/schemas/CargoCount'
        load:
          $ref: '#/components/schemas/CargoCount'
        progressPercent:
          type: integer

    VesselVisitPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/VesselVisit'

    VesselVisitDetail:
      allOf:
        - $ref: '#/components/schemas/VesselVisit'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/VisitItem'

    CreateVesselVisit:
      type: object
      additionalProperties: false
      required: [vesselName, imoNumber, voyage, eta, etd]
      properties:
        vesselName:
          type: string
        imoNumber:
          type: string
          pattern: '^\d{7}$'
        voyage:
          type: string
          maxLength: 10
        eta:
          type: string
          format: date-time
        etd:
          type: string
          format: date-time

    UpdateVesselVisit:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        vesselName:
          type: string
        imoNumber:
          type: string
        voyage:
          type: string
        eta:
          type: string
          format: date-time
        etd:
          type: string
          format: date-time
        status:
          type: string
          enum: [ARRIVED, DEPARTED]
        departWithOpenItems:
          type: boolean

    VisitItemInput:
      type: object
      additionalProperties: false
      required: [containerNumber, size, loadStatus, ownerCode, direction]
      properties:
        containerNumber:
          type: string
        size:
          $ref: '#/components/schemas/ContainerSize'
        isHighCube:
          type: boolean
          default: false
        loadStatus:
          type: string
          enum: [FULL, EMPTY]
        isDangerous:
          type: boolean
          default: false
        imoClass:
          type: [string, 'null']
          description: Required for dangerous goods, for example 3 or 2.1
        grossWeightKg:
          type: [integer, 'null']
          minimum: 1000
          maximum: 60000
        ownerCode:
          type: string
          examples: [HNF]
        direction:
          type: string
          enum: [DISCHARGE, LOAD]

    VisitItem:
      allOf:
        - $ref: '#/components/schemas/VisitItemInput'
        - type: object
          properties:
            id:
              type: integer
            visitId:
              type: integer
            displayNumber:
              type: string
            owner:
              $ref: '#/components/schemas/Company'
            status:
              type: string
              enum: [PENDING, DONE]
            doneAt:
              type: [string, 'null']
              format: date-time
            containerState:
              type: [string, 'null']
              enum: [EXPECTED, IN_YARD, DEPARTED, null]
            positionCode:
              type: [string, 'null']
            hasHold:
              type: boolean

    CargoResult:
      type: object
      properties:
        itemId:
          type: integer
        containerNumber:
          type: string
        positionCode:
          type: string
          description: Discharge only
        fromPosition:
          type: string
          description: Load only
        visit:
          type: object
          properties:
            visitId:
              type: integer
            status:
              type: string
            doneCount:
              type: integer
            totalCount:
              type: integer

    PreAdvice:
      type: object
      properties:
        id:
          type: integer
        reference:
          type: string
          examples: [PA-20260930-0001]
        type:
          type: string
          enum: [DELIVERY, PICKUP]
        status:
          type: string
          enum: [ACTIVE, USED, CANCELLED, EXPIRED]
        containerNumber:
          type: string
        displayNumber:
          type: string
        truckPlate:
          type: string
        driverName:
          type: string
        company:
          $ref: '#/components/schemas/Company'
        timeSlot:
          type: object
          properties:
            id:
              type: integer
            date:
              type: string
              format: date
            startHour:
              type: integer
            startsAt:
              type: string
              format: date-time
            endsAt:
              type: string
              format: date-time
        gateWindow:
          type: object
          properties:
            opensAt:
              type: string
              format: date-time
            closesAt:
              type: string
              format: date-time
        createdAt:
          type: string
          format: date-time

    Invoice:
      type: object
      properties:
        id:
          type: integer
        number:
          type: string
          examples: [INV-2026-00001]
        periodFrom:
          type: string
          format: date-time
        periodTo:
          type: string
          format: date-time
        chargeableDays:
          type: integer
        amountCents:
          type: integer
        status:
          type: string
          enum: [UNPAID, PAID, VOID]

    PreAdviceWithPin:
      allOf:
        - $ref: '#/components/schemas/PreAdvice'
        - type: object
          properties:
            pin:
              type: string
              description: Shown only in this response
              examples: ['482913']
            invoice:
              oneOf:
                - $ref: '#/components/schemas/Invoice'
                - type: 'null'

    CreatePreAdvice:
      type: object
      required: [type, timeSlotId, containerNumber, truckPlate, driverName]
      properties:
        type:
          type: string
          enum: [DELIVERY, PICKUP]
        timeSlotId:
          type: integer
        containerNumber:
          type: string
        truckPlate:
          type: string
          maxLength: 15
        driverName:
          type: string
        size:
          $ref: '#/components/schemas/ContainerSize'
        isHighCube:
          type: boolean
        loadStatus:
          type: string
          enum: [FULL, EMPTY]
        isDangerous:
          type: boolean
        imoClass:
          type: [string, 'null']
        grossWeightKg:
          type: integer
      description: The container fields are required for DELIVERY and not allowed for PICKUP.

    GateInRequest:
      type: object
      additionalProperties: false
      required: [preAdviceId, containerNumber, lane, to]
      properties:
        preAdviceId:
          type: integer
        containerNumber:
          type: string
        lane:
          type: integer
          enum: [1, 2]
        noDamage:
          type: boolean
        damages:
          type: array
          maxItems: 12
          items:
            type: object
            required: [side, code]
            properties:
              side:
                type: string
                enum: [FRONT, BACK, LEFT, RIGHT, TOP, FLOOR]
              code:
                type: string
                enum: [DENT, HOLE, RUST, BROKEN, MISSING]
              note:
                type: string
                maxLength: 200
        to:
          type: string
          examples: [B-02-05]

    GateOutRequest:
      type: object
      additionalProperties: false
      required: [preAdviceId, truckPlate, driverName, lane]
      properties:
        preAdviceId:
          type: integer
        truckPlate:
          type: string
        driverName:
          type: string
        lane:
          type: integer
          enum: [1, 2]

    GateOutCheckResult:
      type: object
      properties:
        passed:
          type: boolean
        checks:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                enum: [PRE_ADVICE, TRUCK_DRIVER, CUSTOMS, INVOICE]
              passed:
                type: boolean
              message:
                type: string
        invoice:
          oneOf:
            - $ref: '#/components/schemas/Invoice'
            - type: 'null'
        relocations:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrder'
        canComplete:
          type: boolean

    GateResult:
      type: object
      properties:
        gateTransactionId:
          type: integer
        containerNumber:
          type: string
        positionCode:
          type: string
          description: Gate-in only
        fromPosition:
          type: string
          description: Gate-out only
        eirUrl:
          type: string
          examples: [/api/v1/gate/transactions/12/eir.pdf]

    GateTransaction:
      type: object
      properties:
        id:
          type: integer
        direction:
          type: string
          enum: [IN, OUT]
        lane:
          type: integer
        truckPlate:
          type: string
        driverName:
          type: string
        containerNumber:
          type: string
        displayNumber:
          type: string
        operator:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        noDamage:
          type: boolean
        damageCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        eirUrl:
          type: string

    CustomsHold:
      type: object
      properties:
        id:
          type: integer
        reason:
          type: string
        isActive:
          type: boolean
        containerNumber:
          type: string
        displayNumber:
          type: string
        containerState:
          type: string
          enum: [EXPECTED, IN_YARD, DEPARTED]
        positionCode:
          type: [string, 'null']
        owner:
          $ref: '#/components/schemas/Company'
        placedBy:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        placedAt:
          type: string
          format: date-time
        releasedBy:
          type: [object, 'null']
        releasedAt:
          type: [string, 'null']
          format: date-time

    InvoiceDetail:
      allOf:
        - $ref: '#/components/schemas/Invoice'
        - type: object
          properties:
            containerNumber:
              type: string
            displayNumber:
              type: string
            company:
              $ref: '#/components/schemas/Company'
            days:
              type: integer
            freeDays:
              type: integer
            dailyRateCents:
              type: integer
            paidAt:
              type: [string, 'null']
              format: date-time
            paidMarkedBy:
              description: Admin only
              type: [object, 'null']
            createdAt:
              type: string
              format: date-time
            pdfUrl:
              type: string

    Notification:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        message:
          type: string
          examples: [HNFU 204571 1 is in the yard at B-02-05-2.]
        containerNumber:
          type: [string, 'null']
        isRead:
          type: boolean
        readAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    Kpis:
      type: object
      properties:
        occupancy:
          type: object
          properties:
            containersInYard:
              type: integer
            teuUsed:
              type: integer
            teuCapacity:
              type: integer
            percent:
              type: number
        gateMovesToday:
          type: object
          properties:
            in:
              type: integer
            out:
              type: integer
            total:
              type: integer
        currentSlot:
          description: Null outside gate hours
          type: [object, 'null']
          properties:
            startsAt:
              type: string
              format: date-time
            endsAt:
              type: string
              format: date-time
            expectedTrucks:
              type: integer
        openWorkOrders:
          type: object
          properties:
            count:
              type: integer
            oldestAgeMinutes:
              type: [integer, 'null']
        activeHolds:
          type: integer
        averageDwellDays:
          type: [number, 'null']
        generatedAt:
          type: string
          format: date-time

    BlockOccupancy:
      type: object
      properties:
        code:
          type: string
        type:
          $ref: '#/components/schemas/BlockType'
        sizeClass:
          $ref: '#/components/schemas/BlockSizeClass'
        capacitySlots:
          type: integer
        usedSlots:
          type: integer
        teuCapacity:
          type: integer
        teuUsed:
          type: integer
        occupancyPercent:
          type: number

    AuditLogEntry:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        action:
          type: string
          examples: [GATE_OUT_DENIED]
        entity:
          type: string
        entityId:
          type: string
        user:
          type: [object, 'null']
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
        ip:
          type: [string, 'null']
        before: {}
        after: {}

  parameters:
    From:
      name: from
      in: query
      description: First day, Europe/Berlin
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      description: Last day, included, Europe/Berlin
      schema:
        type: string
        format: date
    AuditUserId:
      name: userId
      in: query
      schema:
        type: integer
    AuditEntity:
      name: entity
      in: query
      schema:
        type: string
        examples: [Container]
    AuditEntityId:
      name: entityId
      in: query
      schema:
        type: string
    AuditAction:
      name: action
      in: query
      schema:
        type: string
        examples: [MOVE]
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IsActive:
      name: isActive
      in: query
      schema:
        type: string
        enum: ['true', 'false']
    Search:
      name: search
      in: query
      description: Part of the name, email or code
      schema:
        type: string

  responses:
    Csv:
      description: A CSV file with a header row, streamed
      content:
        text/csv:
          schema:
            type: string
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: A business rule prevents this change
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MalformedRequest:
      description: The body is not valid JSON
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAuthenticated:
      description: Not logged in, or the session has ended
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The user's role may not use this endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: The request failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_FAILED
              message: Validation failed
              details:
                - field: body.email
                  message: Enter a valid email address
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
