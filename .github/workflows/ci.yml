name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yardflow_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/yardflow_test
      DATABASE_URL_TEST: mysql://root:root@127.0.0.1:3306/yardflow_test
      TZ: Europe/Berlin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Apply Prisma migrations
        run: npm run db:deploy --workspace @yardflow/api

      - name: Unit and integration tests with coverage
        run: npm run test:coverage

      - name: Build the web app
        run: npm run build

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/shared/coverage
            apps/api/coverage
            apps/web/coverage

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Start the Docker stack with seed data
        run: npm run e2e:up

      - name: Run Playwright
        run: npm run test:e2e
        env:
          E2E_RESTART_API: 'false'

      - name: Show API logs on failure
        if: failure()
        run: docker compose -p yardflow-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs api

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
